[package]
name = "mc630-plt-studio"
version = "0.1.7"
edition = "2024"

[dependencies]
arboard = "3.6"
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
rfd = "0.15"
usvg = "0.45"
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
webbrowser = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
geo = { version = "0.33.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 2
strip = true

# Optimize editor hot paths while retaining debug builds and incremental development.
[profile.dev.package.mc630-plt-studio]
opt-level = 2
